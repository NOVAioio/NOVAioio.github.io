```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA — Games</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background: #050510;
    }

    /* Animated background */
    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -2;
      background:
        radial-gradient(circle at 50% 45%, #24105c 0%, #0b0820 35%, #050510 75%);
    }

    .orb {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .45;
      animation: float 8s ease-in-out infinite alternate;
    }

    .orb.one {
      background: #7c3cff;
      top: -150px;
      left: -120px;
    }

    .orb.two {
      background: #00c8ff;
      bottom: -200px;
      right: -100px;
      animation-delay: 2s;
    }

    @keyframes float {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(80px, 50px) scale(1.15);
      }
    }

    /* Stars */
    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px);
      background-size: 90px 90px, 140px 140px;
      background-position: 0 0, 40px 70px;
      opacity: .18;
      animation: stars 20s linear infinite;
    }

    @keyframes stars {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(90px);
      }
    }

    /* Navigation */
    nav {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(15px);
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .logo span {
      color: #9d6cff;
    }

    .nav-text {
      color: #aaa;
      font-size: 14px;
      letter-spacing: 2px;
    }

    /* Main */
    main {
      min-height: calc(100vh - 80px);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-bottom: 50px;
    }

    .content {
      max-width: 850px;
      padding: 30px;
    }

    .badge {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid rgba(157,108,255,.5);
      border-radius: 50px;
      color: #c6adff;
      background: rgba(157,108,255,.08);
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(70px, 13vw, 170px);
      line-height: .85;
      letter-spacing: 15px;
      font-weight: 900;
      background: linear-gradient(90deg, #fff, #a978ff, #65dfff, #fff);
      background-size: 250%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient 5s linear infinite;
      text-shadow: 0 0 50px rgba(140,80,255,.3);
    }

    @keyframes gradient {
      to {
        background-position: 250%;
      }
    }

    .subtitle {
      margin-top: 30px;
      color: #aaa;
      font-size: 18px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* Button */
    .play {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 45px;
      width: 230px;
      height: 70px;
      border-radius: 16px;
      text-decoration: none;
      color: white;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #7b3cff, #4c8dff);
      box-shadow:
        0 0 25px rgba(123,60,255,.5),
        0 0 80px rgba(76,141,255,.2);
      transition: .25s ease;
      overflow: hidden;
    }

    .play::before {
      content: "";
      position: absolute;
      width: 80px;
      height: 150px;
      background: rgba(255,255,255,.25);
      transform: rotate(25deg) translateX(-180px);
      transition: .5s;
    }

    .play:hover {
      transform: translateY(-6px) scale(1.05);
      box-shadow:
        0 0 35px rgba(123,60,255,.8),
        0 0 100px rgba(76,141,255,.4);
    }

    .play:hover::before {
      transform: rotate(25deg) translateX(300px);
    }

    .play:active {
      transform: scale(.97);
    }

    .hint {
      margin-top: 18px;
      color: #666;
      font-size: 12px;
      letter-spacing: 2px;
    }

    @media (max-width: 600px) {
      nav {
        padding: 0 5%;
      }

      .nav-text {
        display: none;
      }

      h1 {
        letter-spacing: 7px;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="stars"></div>
    <div class="orb one"></div>
    <div class="orb two"></div>
  </div>

  <nav>
    <div class="logo">NO<span>V</span>A</div>
    <div class="nav-text">THE FUTURE OF PLAY</div>
  </nav>

  <main>
    <div class="content">

      <div class="badge">WELCOME TO NOVA</div>

      <h1>NOVA</h1>

      <div class="subtitle">
        Enter. Play. Conquer.
      </div>

      <a href="g.html" class="play">
        PLAY
      </a>

      <div class="hint">
        CLICK TO ENTER
      </div>

    </div>
  </main>

</body>
</html>
```
